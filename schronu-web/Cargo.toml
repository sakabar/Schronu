[package]
name = "schronu-web"
version = "0.1.0"
edition = "2021"

[features]
default = []
web = ["dioxus/web", "dep:gloo-timers"]
server = [
    "dioxus/server",
    "dep:chrono",
    "dep:schronu",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
]

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
tokio = { version = "1", features = ["sync"] }
schronu = { path = "..", optional = true }
chrono = { version = "0.4.24", optional = true }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
futures = "0.3"
serde_json = "1.0"
