[package]
name = "schronu-web"
version = "0.1.0"
edition = "2021"

[features]
default = []
web = ["dioxus/web", "dep:gloo-timers", "dep:web-sys"]
server = [
    "dioxus/server",
    "dep:schronu",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
]

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
tokio = { version = "1", features = ["sync"] }
schronu = { path = "..", optional = true }
chrono = "0.4.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.0"
web-sys = { version = "0.3", features = ["Storage", "Window"], optional = true }

[dev-dependencies]
dioxus-html = { version = "=0.7.10", features = ["serialize"] }
futures = "0.3"
