name: Scheduling performance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  wall-clock-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Check typical schedule
        run: cargo bench --locked --features benchmarking --bench scheduling -- typical schedule check

      - name: Check typical pack
        run: cargo bench --locked --features benchmarking --bench scheduling -- typical pack check

      - name: Check typical flatten
        run: cargo bench --locked --features benchmarking --bench scheduling -- typical flatten check

      - name: Check stress schedule
        run: cargo bench --locked --features benchmarking --bench scheduling -- stress schedule check

      - name: Check stress pack
        run: cargo bench --locked --features benchmarking --bench scheduling -- stress pack check

      - name: Check stress flatten
        run: cargo bench --locked --features benchmarking --bench scheduling -- stress flatten check
